name: Build Windows x64 Portable & Release
on:
  push:
    branches: [master, release/*]
    tags:
      - v*
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-x64:
    runs-on: windows-latest
    env:
      UNSPLASH_KEY: ${{ secrets.UNSPLASH_KEY }}
      UNSPLASH_CLIENT_ID: ${{ secrets.UNSPLASH_CLIENT_ID }}

    steps:
      - name: Check out Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Setup Electron build environment
        uses: ./.github/actions/setup-electron-build

      - name: Install npm Packages
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 15
          shell: bash
          command: npm install @nx/nx-win32-x64-msvc && npm i

      - name: Build Frontend & Electron
        run: npm run buildAllElectron:noTests:prod

      - name: Build Windows x64 Portable EXE
        shell: pwsh
        run: npx electron-builder --win --x64 --publish never

      - name: Package Portable Directory Layout (Program/ + Launcher + Data/)
        shell: pwsh
        run: node tools/build-windows-portable.js .tmp/app-builds

      - name: Verify Windows x64 Portable Artifacts
        shell: pwsh
        run: |
          $expected = @(
            '.tmp/app-builds/Super-Productivity-Portable-x64.zip',
            '.tmp/app-builds/Super-Productivity-Portable-x64.exe'
          )
          foreach ($file in $expected) {
            if (-not (Test-Path $file)) {
              Write-Error "Missing expected artifact: $file"
              exit 1
            }
            $sizeMb = [math]::Round((Get-Item $file).Length / 1MB, 1)
            Write-Host "Verified $file ($sizeMb MiB)"
          }

      - name: Upload Windows x64 Portable Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Super-Productivity-Windows-x64-Portable
          path: |
            .tmp/app-builds/Super-Productivity-Portable-x64.zip
            .tmp/app-builds/Super-Productivity-Portable-x64.exe
          if-no-files-found: error
          retention-days: 14
          overwrite: true

      - name: Publish Windows x64 Portable to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            .tmp/app-builds/Super-Productivity-Portable-x64.zip
            .tmp/app-builds/Super-Productivity-Portable-x64.exe
          fail_on_unmatched_files: true
          draft: false
          prerelease: ${{ contains(github.ref, 'RC') || contains(github.ref, 'beta') || contains(github.ref, 'alpha') }}
