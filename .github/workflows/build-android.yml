name: Build Android APK
on:
  push:
    branches: [master, release/*]
    tags:
      - v*
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      UNSPLASH_KEY: ${{ secrets.UNSPLASH_KEY }}
      UNSPLASH_CLIENT_ID: ${{ secrets.UNSPLASH_CLIENT_ID }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0
          filter: blob:none

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version-file: .nvmrc

      - name: Setup Java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Setup android-sdk
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          accept-android-sdk-licenses: true
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'

      - name: Get npm cache directory
        id: npm-cache-dir
        run: echo "dir=$(npm config get cache)" >> $GITHUB_OUTPUT

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        id: npm-cache
        with:
          path: ${{ steps.npm-cache-dir.outputs.dir }}
          key: ${{ runner.os }}-node22-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node22-

      - name: Install npm Packages
        run: npm i

      - name: Prepare Release Keystore
        env:
          KEYSTORE_B64: ${{ secrets.DROID_KEYSTORE_BASE_64 }}
          KEYSTORE_PASS: ${{ secrets.DROID_KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.DROID_KEYSTORE_ALIAS }}
          KEY_PASS: ${{ secrets.DROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > keystore.jks
            echo "RELEASE_KEYSTORE_PASSWORD=$KEYSTORE_PASS" >> "$GITHUB_ENV"
            echo "RELEASE_KEYSTORE_ALIAS=$KEYSTORE_ALIAS" >> "$GITHUB_ENV"
            echo "RELEASE_KEY_PASSWORD=$KEY_PASS" >> "$GITHUB_ENV"
          else
            echo "No DROID_KEYSTORE_BASE_64 secret configured; generating self-signed release keystore."
            keytool -genkeypair -v \
              -keystore keystore.jks \
              -alias superproductivity \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=Super Productivity, OU=Custom, O=Custom, L=Local, ST=Local, C=US"
            echo "RELEASE_KEYSTORE_PASSWORD=android" >> "$GITHUB_ENV"
            echo "RELEASE_KEYSTORE_ALIAS=superproductivity" >> "$GITHUB_ENV"
            echo "RELEASE_KEY_PASSWORD=android" >> "$GITHUB_ENV"
          fi

      - name: Build Android Release APK
        run: npm run dist:android:prod

      - name: Verify no service worker shipped in the APK
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(android/app/build/outputs/apk/*/release/*.apk)
          if [ ${#apks[@]} -eq 0 ]; then
            echo "::error::no release APK found to verify"
            exit 1
          fi
          for apk in "${apks[@]}"; do
            listing="$(unzip -l "${apk}")"
            if printf '%s\n' "${listing}" \
              | grep -E 'assets/public/(ngsw|safety-worker|worker-basic|sw\.js)'; then
              echo "::error::${apk} ships service-worker assets; the strip in sync:android did not run (#4155)"
              exit 1
            fi
          done

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Super-Productivity-Android-APK
          path: android/app/build/outputs/apk/*/release/*.apk
          if-no-files-found: error
          retention-days: 14
          overwrite: true

      - name: Publish Android APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            android/app/build/outputs/apk/fdroid/release/*.apk
            android/app/build/outputs/apk/play/release/*.apk
          fail_on_unmatched_files: true
          draft: false
          prerelease: ${{ contains(github.ref, 'RC') || contains(github.ref, 'beta') || contains(github.ref, 'alpha') }}
